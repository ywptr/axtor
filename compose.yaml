services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: axtor
      POSTGRES_DB: axtor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axtor -d axtor"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      AXTOR_ENVIRONMENT: development
      AXTOR_DATABASE_URL: postgresql+asyncpg://axtor:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/axtor
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  postgres_data:
